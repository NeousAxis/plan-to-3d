<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>PlanCAD — 2D + 3D</title>
<style>
 *{box-sizing:border-box} html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#eef1f5;overflow:hidden}
 header{height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#1c2433;color:#e8ecf4}
 header b{font-size:15px} header .sep{flex:1}
 header button,header label.btn{background:#2c3a52;color:#dfe6f2;border:0;border-radius:6px;
   padding:6px 12px;font-size:12.5px;cursor:pointer}
 header button.on{background:#4a7cc7;color:#fff}
 header .hint{font-size:11.5px;color:#93a1b8}
 main{position:absolute;top:46px;bottom:0;left:0;right:0;display:flex}
 #pane2d,#pane3d{position:relative;flex:1;min-width:0}
 #pane2d{background:#fff;border-right:1px solid #d5dae2}
 #c2d{position:absolute;inset:0;width:100%;height:100%;display:block}
 #info{position:absolute;left:10px;bottom:10px;background:rgba(28,36,51,.88);color:#e8ecf4;
   padding:8px 12px;border-radius:8px;font-size:12px;line-height:1.5;pointer-events:none;max-width:290px}
 main.v2d #pane3d{display:none} main.v3d #pane2d{display:none}
 .lbl3{color:#1a2230;font-size:11px;font-weight:700;text-shadow:0 1px 2px #fff;pointer-events:none;white-space:nowrap}
</style></head>
<body>
<header>
  <b>PlanCAD</b><span id="pname" style="font-size:12.5px;color:#aab6c9"></span>
  <span class="sep"></span>
  <button id="b2d">2D</button><button id="b3d">3D</button><button id="bsp" class="on">2D + 3D</button>
  <button id="bfp" style="background:#2f7d4f">🚶 Visiter</button>
  <label class="btn">Charger plan…<input type="file" id="fload" accept=".json" hidden></label>
  <button id="fsave">Exporter JSON</button>
  <span class="hint">clic = sélectionner une pièce · glisser-déposer un .json pour charger</span>
</header>
<main id="main">
  <div id="pane2d"><canvas id="c2d"></canvas><div id="info">Chargement…</div></div>
  <div id="pane3d"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script>
'use strict';
const $=q=>document.querySelector(q);
const DOORW=0.9, WINW=1.4, SILL=0.9, WINH=1.2, T=0.10;
const PALETTE=[0xd3e6f7,0xd0efe7,0xf4e3c6,0xd3e6f7,0xd0efe7,0xe9dfc4,0xe4e4e4,0xf5d8c6,0xece9f5];
let MODEL=null, SEL=-1;

const rectRooms=()=>MODEL.rooms.filter(r=>r.rect);
function bboxModel(){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  rectRooms().forEach(r=>{x0=Math.min(x0,r.rect[0]);y0=Math.min(y0,r.rect[1]);
    x1=Math.max(x1,r.rect[2]);y1=Math.max(y1,r.rect[3]);});
  return{x0,y0,x1,y1,w:x1-x0,h:y1-y0};}
const colOf=i=>PALETTE[i%PALETTE.length];

/* ───────────────────────── 2D ───────────────────────── */
const cv=$('#c2d'), g=cv.getContext('2d');
let T2={s:50,ox:40,oy:40};
function layout2d(){
  const W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;
  g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const bb=bboxModel(),m=52;
  T2.s=Math.min((W-2*m)/bb.w,(H-2*m)/bb.h);
  T2.ox=(W-bb.w*T2.s)/2-bb.x0*T2.s; T2.oy=(H-bb.h*T2.s)/2-bb.y0*T2.s;
}
const X=x=>T2.ox+x*T2.s, Y=y=>T2.oy+y*T2.s;
const WT=0.16;                       // wall thickness (m) for the 2D poché

/* seamless floor patterns (drawn once, scaled with zoom) */
let _pat={};
function pat(kind){
  const key=kind+'@'+Math.round(T2.s);
  if(_pat[key])return _pat[key];
  const c=document.createElement('canvas'), g2=c.getContext('2d');
  const s=Math.max(T2.s,8);
  if(kind==='wood'||kind==='woodlight'){
    const plank=Math.max(s*0.16,5);
    c.width=c.height=Math.round(plank*8);
    const base=kind==='wood'?[199,168,124]:[214,190,153];
    for(let r=0;r<8;r++){
      for(let x=-1;x<9;x++){
        const off=(r%2)*plank*2.2;
        const v=(Math.sin(r*3.1+x*7.7)*10)|0;
        g2.fillStyle=`rgb(${base[0]+v},${base[1]+v},${base[2]+v})`;
        g2.fillRect(x*plank*2.2+off,r*plank,plank*2.16,plank-0.8);
      }
      g2.fillStyle='rgba(120,90,55,.35)';
      g2.fillRect(0,r*plank,c.width,0.8);
    }
  }else{ // tile
    const t=Math.max(s*0.45,10);
    c.width=c.height=Math.round(t*2);
    g2.fillStyle='#eceae5';g2.fillRect(0,0,c.width,c.height);
    g2.strokeStyle='rgba(150,148,140,.6)';g2.lineWidth=1;
    for(const v of [0,t,2*t]){g2.beginPath();g2.moveTo(v,0);g2.lineTo(v,c.height);g2.stroke();
      g2.beginPath();g2.moveTo(0,v);g2.lineTo(c.width,v);g2.stroke();}
    for(let i=0;i<60;i++){g2.fillStyle='rgba(140,130,120,.15)';
      g2.fillRect(Math.random()*c.width,Math.random()*c.height,1.6,1.6);}
  }
  _pat[key]=g.createPattern(c,'repeat');
  return _pat[key];
}

/* global wall graph: every wall line drawn ONCE, gaps carved from the
   openings of BOTH sides (fixes shared-wall doors) */
function wallGraph(){
  const lines={};
  const L=(axis,pos)=>{const k=axis+':'+pos.toFixed(2);
    return lines[k]??=({axis,pos:+pos.toFixed(2),spans:[],gaps:[]});};
  const bb=bboxModel();
  MODEL.rooms.forEach(r=>{if(!r.rect)return;
    const[x0,y0,x1,y1]=r.rect;
    L('H',y0).spans.push([x0,x1]); L('H',y1).spans.push([x0,x1]);
    L('V',x0).spans.push([y0,y1]); L('V',x1).spans.push([y0,y1]);
    ['doors','windows'].forEach(kind=>(r[kind]||[]).forEach(o=>{
      const[ax,ay,bx,by]=edge(r.rect,o.wall);
      const len=Math.hypot(bx-ax,by-ay), gw=(kind==='doors'?DOORW:WINW);
      const c=o.at*len;
      const ln=(o.wall==='N')?L('H',y0):(o.wall==='S')?L('H',y1):
               (o.wall==='W')?L('V',x0):L('V',x1);
      const base=(o.wall==='N'||o.wall==='S')?ax:ay;
      ln.gaps.push({a:base+c-gw/2,b:base+c+gw/2,kind:kind==='doors'?'door':'win'});
    }));});
  (MODEL.circulation||[]).forEach(cell=>{
    const HT=0.45,[x0,y0,x1,y1]=cell;
    if(y0<=bb.y0+HT)L('H',y0).spans.push([x0,x1]);
    if(y1>=bb.y1-HT)L('H',y1).spans.push([x0,x1]);
    if(x0<=bb.x0+HT)L('V',x0).spans.push([y0,y1]);
    if(x1>=bb.x1-HT)L('V',x1).spans.push([y0,y1]);});
  // merge coincident lines within half a wall (grid noise)
  const out=[]; const done=new Set();
  const all=Object.values(lines).sort((a,b)=>a.axis===b.axis?a.pos-b.pos:(a.axis<b.axis?-1:1));
  all.forEach((ln,i)=>{if(done.has(i))return;
    for(let j=i+1;j<all.length;j++){
      if(done.has(j))continue;
      const o=all[j];
      if(o.axis===ln.axis&&Math.abs(o.pos-ln.pos)<=WT*0.7){
        ln.spans.push(...o.spans);ln.gaps.push(...o.gaps);done.add(j);}
    }
    // union spans
    const sp=ln.spans.sort((a,b)=>a[0]-b[0]);const merged=[];
    sp.forEach(s=>{const last=merged[merged.length-1];
      if(last&&s[0]<=last[1]+0.02)last[1]=Math.max(last[1],s[1]);
      else merged.push([...s]);});
    ln.spans=merged;out.push(ln);});
  return out;
}
function edge(rect,w){const[x0,y0,x1,y1]=rect;
  if(w=='N')return[x0,y0,x1,y0]; if(w=='S')return[x0,y1,x1,y1];
  if(w=='W')return[x0,y0,x0,y1]; return[x1,y0,x1,y1];}
function gapsOf(r,w){const l=[];
  (r.doors||[]).filter(o=>o.wall==w).forEach(o=>l.push({kind:'door',at:o.at}));
  (r.windows||[]).filter(o=>o.wall==w).forEach(o=>l.push({kind:'win',at:o.at}));return l;}
/* ── professional 2D plan rendering: poché walls, textured floors, drawn
      furniture symbols, door arcs, window symbols, dimension chains ── */
function rr2(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function drawFurnGlyph(f){
  const fw=(f.rect[2]-f.rect[0])*T2.s, fd=(f.rect[3]-f.rect[1])*T2.s;
  const cx=X((f.rect[0]+f.rect[2])/2), cy=Y((f.rect[1]+f.rect[3])/2);
  const rot={N:0,S:Math.PI,W:-Math.PI/2,E:Math.PI/2}[f.wall||'N']||0;
  const back=(f.wall==='N'||f.wall==='S');
  const lw=back?fw:fd, ld=back?fd:fw;             // local: back at -y
  g.save();g.translate(cx,cy);g.rotate(rot);
  const k=kindOf(f);
  const wood='#b98d5a', woodD='#8a6a48', line='#6b533a';
  g.lineWidth=Math.max(1,T2.s*0.02);g.strokeStyle=line;
  if(k==='bed'){
    g.fillStyle=woodD;rr2(-lw/2,-ld/2,lw,ld,3);g.fill();g.stroke();
    g.fillStyle='#f4efe6';rr2(-lw*0.44,-ld*0.42,lw*0.88,ld*0.86,4);g.fill();g.stroke();
    g.fillStyle='#fff';
    rr2(-lw*0.40,-ld*0.42,lw*0.34,ld*0.20,3);g.fill();g.stroke();
    rr2( lw*0.06,-ld*0.42,lw*0.34,ld*0.20,3);g.fill();g.stroke();
    g.fillStyle='#e7ddcb';rr2(-lw*0.44,-ld*0.05,lw*0.88,ld*0.49,4);g.fill();g.stroke();
    g.beginPath();g.moveTo(-lw*0.44,-ld*0.05+6);g.lineTo(lw*0.44,-ld*0.05+6);g.stroke();
  }else if(k==='sofa'){
    g.fillStyle='#cbbba0';rr2(-lw/2,-ld/2,lw,ld,ld*0.25);g.fill();g.stroke();
    g.fillStyle='#dbcdb4';
    rr2(-lw*0.42,-ld*0.12,lw*0.41,ld*0.52,4);g.fill();g.stroke();
    rr2( lw*0.01,-ld*0.12,lw*0.41,ld*0.52,4);g.fill();g.stroke();
  }else if(k==='coffee'){
    g.fillStyle=wood;rr2(-lw/2,-ld/2,lw,ld,4);g.fill();g.stroke();
  }else if(k==='dining'){
    g.fillStyle='#c59a66';rr2(-lw*0.38,-ld*0.34,lw*0.76,ld*0.68,3);g.fill();g.stroke();
    g.fillStyle='#9a7648';
    [[-0.2,-0.5],[0.2,-0.5],[-0.2,0.5],[0.2,0.5]].forEach(([fx,fy])=>{
      rr2(fx*lw-lw*0.08,fy*ld-ld*0.10,lw*0.16,ld*0.20,2);g.fill();g.stroke();});
  }else if(k==='tv'){
    g.fillStyle=woodD;rr2(-lw/2,-ld/2,lw,ld,2);g.fill();g.stroke();
    g.fillStyle='#2c3038';rr2(-lw*0.38,-ld/2,lw*0.76,ld*0.3,1);g.fill();
  }else if(k==='counter'){
    g.fillStyle='#d7d9dc';rr2(-lw/2,-ld/2,lw,ld,2);g.fill();g.stroke();
    g.fillStyle='#eceef0';rr2(-lw*0.42,-ld*0.30,lw*0.22,ld*0.6,3);g.fill();g.stroke();
    g.fillStyle='#3a3f46';
    [[0.14,-0.16],[0.30,-0.16],[0.14,0.16],[0.30,0.16]].forEach(([fx,fy])=>{
      g.beginPath();g.arc(fx*lw,fy*ld,Math.min(lw,ld)*0.09,0,7);g.fill();});
  }else if(k==='fridge'){
    g.fillStyle='#e3e6e9';rr2(-lw/2,-ld/2,lw,ld,2);g.fill();g.stroke();
    g.beginPath();g.moveTo(-lw/2,0);g.lineTo(lw/2,0);g.stroke();
  }else if(k==='bathtub'){
    g.fillStyle='#fff';rr2(-lw/2,-ld/2,lw,ld,ld*0.28);g.fill();g.stroke();
    rr2(-lw*0.40,-ld*0.32,lw*0.80,ld*0.64,ld*0.22);g.stroke();
    g.beginPath();g.arc(-lw*0.3,0,Math.min(lw,ld)*0.07,0,7);g.stroke();
  }else if(k==='vanity'){
    g.fillStyle='#efe9df';rr2(-lw/2,-ld/2,lw,ld,2);g.fill();g.stroke();
    g.beginPath();g.ellipse(0,0,lw*0.3,ld*0.32,0,0,7);g.fillStyle='#fff';g.fill();g.stroke();
  }else if(k==='toilet'){
    g.fillStyle='#fff';
    rr2(-lw*0.42,-ld/2,lw*0.84,ld*0.3,2);g.fill();g.stroke();
    g.beginPath();g.ellipse(0,ld*0.14,lw*0.30,ld*0.32,0,0,7);g.fill();g.stroke();
  }else if(k==='shower'){
    g.fillStyle='#f2f4f5';rr2(-lw/2,-ld/2,lw,ld,3);g.fill();g.stroke();
    g.beginPath();g.arc(0,0,Math.min(lw,ld)*0.08,0,7);g.stroke();
    g.beginPath();g.moveTo(-lw/2,-ld/2);g.lineTo(-lw/2+8,-ld/2+8);g.stroke();
  }else if(k==='wardrobe'){
    g.fillStyle=wood;rr2(-lw/2,-ld/2,lw,ld,2);g.fill();g.stroke();
    g.beginPath();g.moveTo(-lw/2+3,0);g.lineTo(lw/2-3,0);g.stroke();
    g.beginPath();g.moveTo(0,-ld/2);g.lineTo(0,ld/2);g.stroke();
  }else if(k==='nightstand'){
    g.fillStyle=wood;rr2(-lw/2,-ld/2,lw,ld,2);g.fill();g.stroke();
  }else{
    g.fillStyle='rgba(150,110,70,.4)';rr2(-lw/2,-ld/2,lw,ld,2);g.fill();g.stroke();
  }
  g.restore();
}
function dimChainH(cuts,ypx,flip){
  g.strokeStyle='#3a4a63';g.fillStyle='#3a4a63';g.lineWidth=1;
  g.font=`${Math.max(10,T2.s*0.2)|0}px system-ui`;g.textAlign='center';
  g.beginPath();g.moveTo(X(cuts[0]),ypx);g.lineTo(X(cuts[cuts.length-1]),ypx);g.stroke();
  cuts.forEach(c=>{g.beginPath();g.moveTo(X(c)-4,ypx+4);g.lineTo(X(c)+4,ypx-4);g.stroke();});
  for(let i=0;i+1<cuts.length;i++){
    const w=cuts[i+1]-cuts[i]; if(w<0.4)continue;
    g.fillText(w.toFixed(2)+'m',X((cuts[i]+cuts[i+1])/2),ypx+(flip?14:-6));}
}
function dimChainV(cuts,xpx,flip){
  g.strokeStyle='#3a4a63';g.fillStyle='#3a4a63';g.lineWidth=1;
  g.font=`${Math.max(10,T2.s*0.2)|0}px system-ui`;g.textAlign='center';
  g.beginPath();g.moveTo(xpx,Y(cuts[0]));g.lineTo(xpx,Y(cuts[cuts.length-1]));g.stroke();
  cuts.forEach(c=>{g.beginPath();g.moveTo(xpx-4,Y(c)+4);g.lineTo(xpx+4,Y(c)-4);g.stroke();});
  for(let i=0;i+1<cuts.length;i++){
    const d=cuts[i+1]-cuts[i]; if(d<0.4)continue;
    g.save();g.translate(xpx+(flip?12:-8),Y((cuts[i]+cuts[i+1])/2));
    g.rotate(-Math.PI/2);g.fillText(d.toFixed(2)+'m',0,0);g.restore();}
}
function hullCuts(axis,side){
  const bb=bboxModel(),tol=0.45,set=new Set([+(axis==='x'?bb.x0:bb.y0).toFixed(2),
                                             +(axis==='x'?bb.x1:bb.y1).toFixed(2)]);
  MODEL.rooms.forEach(r=>{if(!r.rect)return;const[x0,y0,x1,y1]=r.rect;
    const touch=axis==='x'
      ?(side==='min'?y0<=bb.y0+tol:y1>=bb.y1-tol)
      :(side==='min'?x0<=bb.x0+tol:x1>=bb.x1-tol);
    if(touch){set.add(+(axis==='x'?x0:y0).toFixed(2));
              set.add(+(axis==='x'?x1:y1).toFixed(2));}});
  return[...set].sort((a,b)=>a-b);
}
function draw2d(){
  const W=cv.clientWidth,H=cv.clientHeight;
  g.fillStyle='#fbfaf7';g.fillRect(0,0,W,H);
  const bb=bboxModel();
  // building shadow
  g.save();g.shadowColor='rgba(30,40,60,.25)';g.shadowBlur=18;g.shadowOffsetY=6;
  g.fillStyle='#fff';
  g.fillRect(X(bb.x0)-WT*T2.s,Y(bb.y0)-WT*T2.s,(bb.w+2*WT)*T2.s,(bb.h+2*WT)*T2.s);
  g.restore();
  // floors
  (MODEL.circulation||[]).forEach(c=>{
    g.fillStyle=pat('woodlight');
    g.fillRect(X(c[0]),Y(c[1]),(c[2]-c[0])*T2.s,(c[3]-c[1])*T2.s);});
  MODEL.rooms.forEach((r,i)=>{if(!r.rect)return;
    g.fillStyle=pat(WET(r.name)?'tile':'wood');
    g.fillRect(X(r.rect[0]),Y(r.rect[1]),(r.rect[2]-r.rect[0])*T2.s,(r.rect[3]-r.rect[1])*T2.s);
    if(i===SEL){g.fillStyle='rgba(255,214,90,.30)';
      g.fillRect(X(r.rect[0]),Y(r.rect[1]),(r.rect[2]-r.rect[0])*T2.s,(r.rect[3]-r.rect[1])*T2.s);}});
  // furniture symbols
  MODEL.rooms.forEach(r=>(r.furniture||[]).forEach(drawFurnGlyph));
  // walls (poché) from the global wall graph — one line, both sides' gaps
  const wt=WT*T2.s;
  g.fillStyle='#1c2a44';
  wallGraph().forEach(ln=>{
    ln.spans.forEach(([a,b])=>{
      // solid runs = span minus gaps
      const gaps=ln.gaps.filter(gp=>gp.b>a&&gp.a<b).sort((p,q)=>p.a-q.a);
      let cur=a;const runs=[];
      gaps.forEach(gp=>{if(gp.a>cur)runs.push([cur,Math.min(gp.a,b)]);
        cur=Math.max(cur,gp.b);});
      if(cur<b)runs.push([cur,b]);
      runs.forEach(([r0,r1])=>{
        if(ln.axis==='H')g.fillRect(X(r0)-wt/2,Y(ln.pos)-wt/2,(r1-r0)*T2.s+wt,wt);
        else g.fillRect(X(ln.pos)-wt/2,Y(r0)-wt/2,wt,(r1-r0)*T2.s+wt);});
      // window symbols inside their gaps
      gaps.filter(gp=>gp.kind==='win').forEach(gp=>{
        const w0=Math.max(gp.a,a),w1=Math.min(gp.b,b);
        g.save();g.strokeStyle='#2a72c8';g.lineWidth=1.4;g.fillStyle='#dcecf8';
        if(ln.axis==='H'){
          g.fillRect(X(w0),Y(ln.pos)-wt/2,(w1-w0)*T2.s,wt);
          [-wt/2,0,wt/2].forEach(o=>{g.beginPath();
            g.moveTo(X(w0),Y(ln.pos)+o);g.lineTo(X(w1),Y(ln.pos)+o);g.stroke();});
        }else{
          g.fillRect(X(ln.pos)-wt/2,Y(w0),wt,(w1-w0)*T2.s);
          [-wt/2,0,wt/2].forEach(o=>{g.beginPath();
            g.moveTo(X(ln.pos)+o,Y(w0));g.lineTo(X(ln.pos)+o,Y(w1));g.stroke();});
        }
        g.restore();});
    });});
  // door leaves + swing arcs (per room, opening inward)
  MODEL.rooms.forEach(r=>{if(!r.rect)return;
    const cx=(r.rect[0]+r.rect[2])/2, cy=(r.rect[1]+r.rect[3])/2;
    (r.doors||[]).forEach(o=>{
      const[ax,ay,bx,by]=edge(r.rect,o.wall);
      const len=Math.hypot(bx-ax,by-ay),ux=(bx-ax)/len,uy=(by-ay)/len;
      const t0=o.at*len-DOORW/2;
      const hx=ax+ux*t0,hy=ay+uy*t0;
      const ex=hx+ux*DOORW,ey=hy+uy*DOORW;
      let nx=-uy,ny=ux;
      if((cx-hx)*nx+(cy-hy)*ny<0){nx=-nx;ny=-ny;}
      g.strokeStyle='#8a5a2b';g.lineWidth=Math.max(1.6,T2.s*0.035);
      g.beginPath();g.moveTo(X(hx),Y(hy));g.lineTo(X(hx+nx*DOORW),Y(hy+ny*DOORW));g.stroke();
      const a0=Math.atan2(Y(hy+ny*DOORW)-Y(hy),X(hx+nx*DOORW)-X(hx));
      const a1=Math.atan2(Y(ey)-Y(hy),X(ex)-X(hx));
      let dd=a1-a0;while(dd>Math.PI)dd-=2*Math.PI;while(dd<-Math.PI)dd+=2*Math.PI;
      g.lineWidth=1;g.beginPath();
      for(let i=0;i<=14;i++){const a2=a0+dd*i/14;

    if(!c)return;

      g.fillText(r.area_m2+' m²',X(c[0]),Y(c[1])+fs);}});
  // dimension chains generated from the geometry (real bays)
  dimChainH(hullCuts('x','min'),Y(bb.y0)-22,false);
  dimChainH(hullCuts('x','max'),Y(bb.y1)+22,true);
  dimChainV(hullCuts('y','min'),X(bb.x0)-22,false);

/* procedural textures — zero external assets, stays distributable */
function texCanvas(draw,rx,ry){
  const c=document.createElement('canvas');c.width=c.height=256;
  draw(c.getContext('2d'),256,256);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t;}
function makeMats(){
  const parquet=texCanvas((g,w,h)=>{
    g.fillStyle='#c9aa80';g.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=32)for(let x=-64;x<w;x+=128){
      const off=((y/32)%2)*64;
      g.fillStyle=`hsl(${28+Math.random()*10},${34+Math.random()*12}%,${56+Math.random()*12}%)`;
      g.fillRect(x+off,y+1,126,30);}
    g.fillStyle='rgba(90,60,30,.3)';
    for(let y=0;y<h;y+=32)g.fillRect(0,y,w,1);},3,3);
  const tile=texCanvas((g,w,h)=>{
    g.fillStyle='#e9e7e2';g.fillRect(0,0,w,h);
    for(let i=0;i<800;i++){g.fillStyle='rgba(140,130,120,.22)';
      g.fillRect(Math.random()*w,Math.random()*h,2.2,2.2);}
    g.strokeStyle='rgba(160,160,160,.55)';g.lineWidth=1.4;
    for(let v=0;v<=w;v+=64){g.beginPath();g.moveTo(v,0);g.lineTo(v,h);g.stroke();
      g.beginPath();g.moveTo(0,v);g.lineTo(w,v);g.stroke();}},2,2);
  const wood=texCanvas((g,w,h)=>{
    g.fillStyle='#8a6a48';g.fillRect(0,0,w,h);
    for(let i=0;i<38;i++){g.strokeStyle=`rgba(58,38,20,${.08+Math.random()*.12})`;
      g.lineWidth=1+Math.random()*2;g.beginPath();g.moveTo(0,Math.random()*h);
      g.bezierCurveTo(w/3,Math.random()*h,2*w/3,Math.random()*h,w,Math.random()*h);
      g.stroke();}},1,1);
  return {
    wall:new THREE.MeshLambertMaterial({color:0xf2efe9}),
    parquet:new THREE.MeshLambertMaterial({map:parquet}),
    tile:new THREE.MeshLambertMaterial({map:tile}),
    wood:new THREE.MeshLambertMaterial({map:wood}),
    woodDark:new THREE.MeshLambertMaterial({color:0x6b4e33}),
    white:new THREE.MeshLambertMaterial({color:0xfafafa}),
    linen:new THREE.MeshLambertMaterial({color:0xece7dd}),
    fabric:new THREE.MeshLambertMaterial({color:0xb3a289}),
    glass:new THREE.MeshLambertMaterial({color:0xaad4e8,transparent:true,opacity:0.32}),
    steel:new THREE.MeshLambertMaterial({color:0xc9ced3}),

  };
}

/* parametric furniture — composed boxes, oriented by the wall it backs onto */
function _b(grp,mat,w,h,d,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;grp.add(m);return m;}
function buildFurn(kind,lw,ld,h){
  const g=new THREE.Group();          // local: back of the piece at -z
  if(kind==='bed'){
    _b(g,MAT.wood,lw,.3,ld*.96,0,.15,ld*.02);
    _b(g,MAT.linen,lw*.94,.2,ld*.78,0,.4,ld*.04);
    _b(g,MAT.woodDark,lw,1.05,.07,0,.53,-ld/2+.04);
    _b(g,MAT.white,lw*.38,.12,.42,-lw*.24,.56,-ld/2+.34);
    _b(g,MAT.white,lw*.38,.12,.42, lw*.24,.56,-ld/2+.34);
    _b(g,MAT.fabric,lw*.96,.07,ld*.45,0,.5,ld*.2);
  }else if(kind==='sofa'){
    _b(g,MAT.fabric,lw,.42,ld*.78,0,.21,ld*.11);
    _b(g,MAT.fabric,lw,.85,ld*.26,0,.43,-ld/2+ld*.13);
    _b(g,MAT.fabric,lw*.12,.6,ld,-lw/2+lw*.06,.3,0);
    _b(g,MAT.fabric,lw*.12,.6,ld, lw/2-lw*.06,.3,0);
  }else if(kind==='coffee'){
    _b(g,MAT.wood,lw,.05,ld,0,.33,0);
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>
      _b(g,MAT.dark,.05,.32,.05,sx*(lw/2-.06),.16,sz*(ld/2-.06)));
  }else if(kind==='dining'){
    _b(g,MAT.wood,lw,.05,ld,0,.73,0);
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>
      _b(g,MAT.woodDark,.06,.71,.06,sx*(lw/2-.08),.36,sz*(ld/2-.08)));
    [[-.28,-1],[.28,-1],[-.28,1],[.28,1]].forEach(([fx,sz])=>{
      _b(g,MAT.dark,.4,.05,.4,fx*lw,.45,sz*(ld/2+.25));
      _b(g,MAT.dark,.4,.42,.05,fx*lw,.68,sz*(ld/2+.45));});
  }else if(kind==='tv'){
    _b(g,MAT.woodDark,lw,.45,ld,0,.225,0);
    _b(g,MAT.dark,lw*.72,.52,.04,0,.85,-ld/2+.05);
  }else if(kind==='counter'){
    _b(g,MAT.wood,lw,.85,ld,0,.425,0);
    _b(g,MAT.steel,lw+.02,.04,ld+.02,0,.885,0);
    _b(g,MAT.dark,lw*.28,.02,ld*.6,-lw*.22,.91,0);
    _b(g,MAT.steel,lw*.24,.02,ld*.55,lw*.24,.91,0);
  }else if(kind==='fridge'){
    _b(g,MAT.steel,lw,h,ld,0,h/2,0);
    _b(g,MAT.dark,.04,h*.5,.05,lw/2-.06,h*.55,ld/2+.01);
  }else if(kind==='bathtub'){
    _b(g,MAT.white,lw,.55,ld,0,.275,0);
    _b(g,MAT.glass,lw*.86,.03,ld*.72,0,.5,0);
    _b(g,MAT.steel,.08,.25,.08,0,.65,-ld/2+.08);
  }else if(kind==='vanity'){
    _b(g,MAT.wood,lw,.78,ld,0,.39,0);
    _b(g,MAT.white,lw*.82,.12,ld*.7,0,.85,0);
    _b(g,MAT.glass,lw*.8,.7,.03,0,1.55,-ld/2+.02);
  }else if(kind==='toilet'){
    _b(g,MAT.white,lw*.7,.4,ld*.62,0,.2,ld*.12);
    _b(g,MAT.white,lw,.4,.16,0,.55,-ld/2+.08);
  }else if(kind==='shower'){
    _b(g,MAT.white,lw,.1,ld,0,.05,0);
    _b(g,MAT.glass,lw,1.9,.03,0,1.05,ld/2-.02);
    _b(g,MAT.glass,.03,1.9,ld,lw/2-.02,1.05,0);
    _b(g,MAT.steel,.06,.5,.06,-lw/2+.1,2.0,-ld/2+.1);
  }else if(kind==='wardrobe'){
    _b(g,MAT.wood,lw,h,ld,0,h/2,0);
    _b(g,MAT.woodDark,.02,h*.9,.02,0,h/2,ld/2+.005);
  }else if(kind==='nightstand'){
    _b(g,MAT.wood,lw,.5,ld,0,.25,0);
  }else{
    _b(g,MAT.wood,lw,h||.6,ld,0,(h||.6)/2,0);
  }
  return g;}
const KIND_RE=[[/lit|bed/i,'bed'],[/chevet|nightstand/i,'nightstand'],
  [/armoire|wardrobe|penderie|placard/i,'wardrobe'],[/canap|sofa/i,'sofa'],
  [/table basse|coffee/i,'coffee'],[/table/i,'dining'],[/tv/i,'tv'],
  [/plan de travail|worktop|counter/i,'counter'],[/frigo|réfrig|fridge/i,'fridge'],
  [/baignoire|bathtub/i,'bathtub'],[/vasque|lavabo|lave-mains|vanity/i,'vanity'],
  [/^wc$|toilet/i,'toilet'],[/douche|shower/i,'shower']];
function kindOf(f){if(f.kind)return f.kind;
  for(const[re,k]of KIND_RE)if(re.test(f.item||''))return k;return 'generic';}

let _map3=null;
function build3d(){
  if(!MAT)MAT=makeMats();
  R3.lr.domElement.innerHTML='';
  const sc=new THREE.Scene();sc.background=new THREE.Color(0xdfe6ee);
  sc.add(new THREE.HemisphereLight(0xffffff,0x8a8072,0.75));
  const dl=new THREE.DirectionalLight(0xfff2df,0.85);
  dl.position.set(7,14,5);dl.castShadow=true;
  dl.shadow.mapSize.set(2048,2048);
  const bb=bboxModel();
  const ext=Math.max(bb.w,bb.h)*0.75;
  dl.shadow.camera.left=-ext;dl.shadow.camera.right=ext;
  dl.shadow.camera.top=ext;dl.shadow.camera.bottom=-ext;
  sc.add(dl);
  const CXm=(bb.x0+bb.x1)/2,CYm=(bb.y0+bb.y1)/2;
  const mX=x=>x-CXm,mZ=y=>y-CYm;
  _map3={mX,mZ,bb};
  const H=MODEL.wall_height||2.5;
  const box=(ax,ay,bx,by,y0,y1,mat)=>{const len=Math.hypot(bx-ax,by-ay);if(len<0.02)return;
    const m=new THREE.Mesh(new THREE.BoxGeometry(len,y1-y0,T),mat);
    m.position.set(mX((ax+bx)/2),(y0+y1)/2,mZ((ay+by)/2));
    m.rotation.y=-Math.atan2(by-ay,bx-ax);
    m.castShadow=m.receiveShadow=true;sc.add(m);};
  R3.floors=[];R3.baseCol=[];R3.ceilings=[];
  MODEL.rooms.forEach((r,i)=>{
    const c=r.rect?[(r.rect[0]+r.rect[2])/2,(r.rect[1]+r.rect[3])/2]:r.label_at;
    if(r.rect){
      const w=r.rect[2]-r.rect[0],d=r.rect[3]-r.rect[1];
      const base=WET(r.name)?MAT.tile:MAT.parquet;
      const fl=new THREE.Mesh(new THREE.BoxGeometry(w,0.06,d),base.clone());
      fl.position.set(mX(c[0]),0.03,mZ(c[1]));fl.receiveShadow=true;sc.add(fl);
      R3.floors[i]=fl;R3.baseCol[i]=fl.material.color.getHex();
      const ce=new THREE.Mesh(new THREE.BoxGeometry(w,0.05,d),MAT.ceil);
      ce.position.set(mX(c[0]),H+0.025,mZ(c[1]));ce.visible=false;sc.add(ce);
      R3.ceilings.push(ce);
      ['N','S','W','E'].forEach(wl=>{
        const[ax,ay,bx,by]=edge(r.rect,wl);
        const len=Math.hypot(bx-ax,by-ay),ux=(bx-ax)/len,uy=(by-ay)/len;
        const gaps=gapsOf(r,wl).map(o=>{const gw=o.kind=='win'?WINW:DOORW;
          return{t0:(o.at*len-gw/2)/len,t1:(o.at*len+gw/2)/len,kind:o.kind};}).sort((p,q)=>p.t0-q.t0);
        let cur=0;const solid=[];
        gaps.forEach(gp=>{if(gp.t0>cur)solid.push([cur,gp.t0]);cur=Math.max(cur,gp.t1);});
        if(cur<1)solid.push([cur,1]);
        solid.forEach(([t0,t1])=>box(ax+ux*len*t0,ay+uy*len*t0,ax+ux*len*t1,ay+uy*len*t1,0,H,MAT.wall));
        gaps.forEach(gp=>{
          const a=[ax+ux*len*gp.t0,ay+uy*len*gp.t0],b=[ax+ux*len*gp.t1,ay+uy*len*gp.t1];
          if(gp.kind=='win'){
            box(a[0],a[1],b[0],b[1],0,SILL,MAT.wall);
            box(a[0],a[1],b[0],b[1],SILL+WINH,H,MAT.wall);
            box(a[0],a[1],b[0],b[1],SILL,SILL+WINH,MAT.glass);
          }else{
            box(a[0],a[1],b[0],b[1],2.05,H,MAT.wall);   // door lintel
          }});
      });
      (r.furniture||[]).forEach(f=>{
        const fw=f.rect[2]-f.rect[0],fd=f.rect[3]-f.rect[1];

        const ld=(back=='N'||back=='S')?fd:fw;
        const grp=buildFurn(kindOf(f),lw,ld,f.h||.6);
        grp.rotation.y={N:0,S:Math.PI,W:Math.PI/2,E:-Math.PI/2}[back]||0;
        grp.position.set(mX((f.rect[0]+f.rect[2])/2),0.06,mZ((f.rect[1]+f.rect[3])/2));
        sc.add(grp);});
    }
    if(c){const el=document.createElement('div');el.className='lbl3';el.textContent=r.name;
      const lab=new THREE.CSS2DObject(el);lab.position.set(mX(c[0]),0.25,mZ(c[1]));sc.add(lab);}
  });

  (MODEL.circulation||[]).forEach(g=>{
    const w=g[2]-g[0],d=g[3]-g[1];

    fl.position.set(mX((g[0]+g[2])/2),0.03,mZ((g[1]+g[3])/2));
    fl.receiveShadow=true;sc.add(fl);
    const ce=new THREE.Mesh(new THREE.BoxGeometry(w,0.05,d),MAT.ceil);
    ce.position.set(mX((g[0]+g[2])/2),H+0.025,mZ((g[1]+g[3])/2));
    ce.visible=false;sc.add(ce);R3.ceilings.push(ce);
    const HT=0.45;
    if(g[1]<=bb.y0+HT)box(g[0],g[1],g[2],g[1],0,H,MAT.wall);
    if(g[3]>=bb.y1-HT)box(g[0],g[3],g[2],g[3],0,H,MAT.wall);
    if(g[0]<=bb.x0+HT)box(g[0],g[1],g[0],g[3],0,H,MAT.wall);
    if(g[2]>=bb.x1-HT)box(g[2],g[1],g[2],g[3],0,H,MAT.wall);
  });
  R3.scene=sc;
}
function update3dSel(){

/* ── first-person walkthrough ── */
function enterFP(){
  if(!MODEL||R3.fp)return;
  R3.savedCam={pos:R3.camera.position.clone(),
               tgt:R3.controls.target.clone()};
  // spawn in the circulation (or first room)
  let spawn=null;
  for(const r of MODEL.rooms)
    if(r.rect&&/HALL|DGT|ENTR/i.test(r.name)){spawn=r.rect;break;}
  if(!spawn)spawn=MODEL.rooms.find(r=>r.rect).rect;
  R3.eye.x=_map3.mX((spawn[0]+spawn[2])/2);
  R3.eye.z=_map3.mZ((spawn[1]+spawn[3])/2);
  R3.yaw=0;R3.pitch=0;R3.fp=true;
  R3.controls.enabled=false;
  R3.ceilings.forEach(m=>m.visible=true);
  R3.lr.domElement.style.display='none';
  $('#bfp').textContent='⏻ Quitter (Échap)';
  R3.renderer.domElement.requestPointerLock();
  setView('v3d');
}
function exitFP(){
  if(!R3.fp)return;
  R3.fp=false;
  R3.ceilings.forEach(m=>m.visible=false);
  R3.lr.domElement.style.display='';
  R3.controls.enabled=true;
  if(R3.savedCam){R3.camera.position.copy(R3.savedCam.pos);
    R3.controls.target.copy(R3.savedCam.tgt);}
  $('#bfp').textContent='🚶 Visiter';
  if(document.pointerLockElement)document.exitPointerLock();
}
function stepFP(dt){
  const sp=2.6*dt;
  const f=new THREE.Vector3(-Math.sin(R3.yaw),0,-Math.cos(R3.yaw));
  const s=new THREE.Vector3(f.z,0,-f.x);
  const k=R3.keys;
  if(k['KeyW']||k['ArrowUp']||k['KeyZ']){R3.eye.x+=f.x*sp;R3.eye.z+=f.z*sp;}
  if(k['KeyS']||k['ArrowDown']){R3.eye.x-=f.x*sp;R3.eye.z-=f.z*sp;}
  if(k['KeyA']||k['ArrowLeft']||k['KeyQ']){R3.eye.x+=s.x*sp;R3.eye.z+=s.z*sp;}
  if(k['KeyD']||k['ArrowRight']){R3.eye.x-=s.x*sp;R3.eye.z-=s.z*sp;}
  const bb=_map3.bb,hx=bb.w/2-.25,hz=bb.h/2-.25;
  R3.eye.x=Math.max(-hx,Math.min(hx,R3.eye.x));
  R3.eye.z=Math.max(-hz,Math.min(hz,R3.eye.z));
  R3.camera.position.set(R3.eye.x,1.6,R3.eye.z);
  R3.camera.rotation.y=R3.yaw;R3.camera.rotation.x=R3.pitch;
}
addEventListener('keydown',e=>{R3.keys[e.code]=true;
  if(e.code==='Escape')exitFP();
  if(e.code==='KeyP')shotPNG('base_view.png');});
addEventListener('keyup',e=>{R3.keys[e.code]=false;});
addEventListener('mousemove',e=>{if(!R3.fp||!document.pointerLockElement)return;
  R3.yaw-=e.movementX*0.0024;
  R3.pitch=Math.max(-1.25,Math.min(1.25,R3.pitch-e.movementY*0.0024));});
document.addEventListener('pointerlockchange',()=>{
  if(!document.pointerLockElement&&R3.fp)exitFP();});

$('#fload').addEventListener('change',e=>{const f=e.target.files[0];if(f)loadFile(f);});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)loadFile(f);});
function loadFile(f){const rd=new FileReader();
  rd.onload=()=>{try{setModel(JSON.parse(rd.result));}catch(err){alert('JSON invalide : '+err.message);}};
  rd.readAsText(f);}
$('#fsave').onclick=()=>{if(!MODEL)return;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(MODEL,null,2)],{type:'application/json'}));
  a.download=(MODEL.project||'plan').replace(/[^\w-]+/g,'_')+'.plan.json';a.click();};
addEventListener('resize',()=>{layout2d();resize3d();if(MODEL)draw2d();});

/* static eye-level camera inside a room — base image for the img2img
   enhancement pipeline: ?eye=LIVING&yaw=-40 (yaw optional, degrees) */
function staticEye(r,yawDeg){
  setView('v3d');
  R3.fp=true;R3.controls.enabled=false;
  R3.ceilings.forEach(c=>c.visible=true);
  R3.lr.domElement.style.display='none';
  const[x0,y0,x1,y1]=r.rect,cx=(x0+x1)/2,cy=(y0+y1)/2;
  let ex=cx,ez=cy,ya=0;
  const d=(r.doors||[])[0];
  if(d){const e=edge(r.rect,d.wall);
    const px=e[0]+(e[2]-e[0])*d.at,py=e[1]+(e[3]-e[1])*d.at;
    // shoot from the corner nearest the door, aimed at the room centre —
    // widest, most natural interior view
    const kx=(px<cx)?x0+0.35:x1-0.35, ky=(py<cy)?y0+0.35:y1-0.35;
    ex=kx;ez=ky;
    ya=Math.atan2(-(cx-ex),-(cy-ez));}
  R3.eye.x=_map3.mX(ex);R3.eye.z=_map3.mZ(ez);
  R3.yaw=(yawDeg==null?ya:yawDeg*Math.PI/180);R3.pitch=0;
}
/* headless-friendly canvas capture: ?shot=1 POSTs the 3D view as PNG to the
   local shot server (tools/shot_server.py, port 8778) — no user gesture
   needed, so the whole per-room base-image pipeline can run unattended */
function shotPNG(name){
  R3.renderer.render(R3.scene,R3.camera);
  R3.renderer.domElement.toBlob(b=>{
    fetch('http://localhost:8778/save/'+name,{method:'POST',body:b})
      .then(()=>console.log('shot saved:',name))
      .catch(err=>console.warn('shot server absent:',err));},'image/png');
}

/* boot — ?plan=plans/xxx.json pour charger un autre plan */
init3d();
const Q=new URLSearchParams(location.search);
const PLAN=Q.get('plan')||'plans/apartment_2br.json';
fetch(PLAN).then(r=>r.json()).then(m=>{
  setModel(m);
  const eye=Q.get('eye');
  if(eye){
    const r=MODEL.rooms.find(r=>r.rect&&r.name.toUpperCase().includes(eye.toUpperCase()));
    if(r){staticEye(r,Q.get('yaw')?parseFloat(Q.get('yaw')):null);
      if(Q.get('shot'))setTimeout(()=>shotPNG(
        'base_'+r.name.replace(/[^\w]+/g,'_').toLowerCase()+'.png'),1200);}
  }
}).catch(()=>{$('#info').innerHTML='⚠ Servir via http (python3 -m http.server) ou glisser-déposer un plan .json';});
</script>
